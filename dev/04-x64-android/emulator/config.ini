# =============================================================================
# AutoSnap x86_64 + ARM64 桥 —— 模拟器运行配置（本项目唯一真源）
#
# 模拟器首次启动时会拿这份文件生成 <sysdir>/hardware-qemu.ini，
# 再由它决定屏幕尺寸、像素密度、数据分区大小等"硬件"参数。
#
# 为什么要覆盖：
#   ROM 构建时 goldfish 的
#     device/generic/goldfish/64bitonly/product/x86_64-vendor.mk
#   会把 data/etc/config.ini.xl 装成产物里的 config.ini —— 那一份是
#   **1440x2960 @560dpi**（Pixel 3 XL 尺寸）。1440x2960 配 -gpu swiftshader_indirect
#   （纯 CPU 软件光栅化）要按 60fps 画 425 万像素，是本配置里最贵的一项。
#   这里改成 720x1280 @320dpi：像素量降到约 1/4.6，仍是标准手机比例
#   （逻辑尺寸 360 x 640 dp，density bucket = xhdpi）。
#
# 生效路径（三处都从 scripts/common.sh 的 $EMULATOR_CONFIG 取，同一份内容）：
#   scripts/run-linux.sh    → 写进 .run/sysdir-<port>/config.ini
#   scripts/package-rom.sh  → 写进交付目录 artifacts/rom-<product>/config.ini
#   windows/run-windows.ps1 → 写进 windows/images/config.ini
#
# 改完**不需要重新构建 ROM**（config.ini 是模拟器侧文件，不参与 AOSP 构建）。
# 要回到 1440x2960@560，只改下面 skin.name / skin.path / hw.lcd.density 三行。
# =============================================================================
avd.ini.encoding=UTF-8
# 数据分区大小。原来是 6G —— 装个 APK 没问题，但**测不了大应用**：
#   · 一次安装的磁盘峰值约是 APK 的 3 倍（我们拿到的那份 + 落盘的副本
#     + pm 自己的 session 副本，实测 900MB 的 APK 峰值 2.7GB）
#   · 再叠上上传时的落盘，测 3GB 的应用需要 12GB 以上
# 48G 给足余量，宿主（458G 数据盘）也放得下。
#
# ⚠️ 改这一项之后**必须清掉旧的 userdata 镜像**（.run/sysdir-*/userdata-qemu.img*
#    及其 .qcow2），否则模拟器会按旧尺寸沿用，改了不生效。
#    代价是数据分区被重新格式化 —— 已装的应用会没。
disk.dataPartition.size=48G
fastboot.forceColdBoot = yes
hw.accelerometer=yes
hw.audioInput=yes
hw.battery=yes
hw.camera.back=emulated
hw.camera.front=emulated
hw.dPad=no
hw.gps=yes
hw.gpu.enabled=yes
hw.keyboard=yes
hw.mainKeys=no
hw.ramSize=2048
hw.sensors.orientation=yes
hw.sensors.proximity=yes
image.sysdir.1=x86/
skin.dynamic=no
hw.lcd.density=320
skin.name=720x1280
skin.path=720x1280
