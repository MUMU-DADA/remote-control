# =============================================================================
# remote-control x86_64 + ARM64 桥 —— 模拟器运行配置（本项目唯一真源）
#
# 模拟器首次启动时会拿这份文件生成 <sysdir>/hardware-qemu.ini，
# 再由它决定屏幕尺寸、像素密度、内存、CPU 核数、数据分区大小等"硬件"参数。
#
# 生效路径（三处都从 scripts/common.sh 的 $EMULATOR_CONFIG 取，同一份内容）：
#   scripts/run-linux.sh    → 写进 .run/sysdir-<port>/config.ini
#   scripts/emulator.sh     → 写进新实例的工作目录（create / clone 时）
#   scripts/package-rom.sh  → 写进交付目录 artifacts/rom-<product>/config.ini
#   windows/run-windows.ps1 → 写进 windows/images/config.ini
#
# 改完**不需要重新构建 ROM**（config.ini 是模拟器侧文件，不参与 AOSP 构建）。
#
# ⚠️ 但有三件事会**沿用旧值**，改完要清掉对应状态才生效：
#   · disk.dataPartition.size → 必须删掉 userdata-qemu.img*（会重新格式化 /data）
#   · hw.lcd.* / skin.*       → 删掉 hardware-qemu.ini 就会按新值重算
#   · 任何 hw.* 改动           → 已存的快照全部作废（模拟器会拒绝加载）
#   用 ./scripts/emulator.sh reset <实例> 一次做掉前三样里的前两样。
# =============================================================================
avd.ini.encoding=UTF-8

# ── 数据分区：64G ───────────────────────────────────────────────────────────
# 单次安装峰值约为 APK 的 3 倍（上传副本、安装解包、PackageManager session）。
# 64G 为大型应用和游戏数据留出空间，也能容纳 4G 上传上限的 APK 安装峰值。
#   （上传落盘的副本 + /data/app 里解出来的 + pm 自己的 session 副本，
#     实测 900MB 的 APK 峰值 2.7GB）。
# 已有实例须 reset 才会重建数据卷；这会清除实例数据。
#
# ⚠️ 这是**上限**不是预分配：实际占用看 qcow2 覆盖层长到多大。
#    但它是真的会长的 —— 装个 20G 的游戏，宿主上就真占 20G。
disk.dataPartition.size=64G

# ── guest 首次启动服务配置 ──────────────────────────────────────────────────
# 启动脚本将这些值传给 Android guest。只在 remote-control.conf 不存在时
# 初始化该文件；之后 API 和设备内配置会保留自己的修改。
# 正式 release 默认启用服务与鉴权，token 留空时宿主首次实例化随机生成并
# 保存到 .run/instances/<实例名>.token，复用实例时保留；无需 ADB 获取。
# 测试包可用 release.sh --test-release，测试新实例用 --test-instance。
service.enabled=1
service.bind=0.0.0.0
service.port=8088
service.auth=1
service.token=
service.adb_enabled=1

fastboot.forceColdBoot = yes

# ── CPU / 内存 ──────────────────────────────────────────────────────────────
# 4 核 6G（6144 MB）。宿主是 16 核 / 32G，单实例留足余量，同时开两台也不至于换页。
#
# 单位：写 6144 或 6G 都认（run-linux.sh / emulator.sh 会把 G 换算成 MB 再传给
# -memory）。这里刻意用裸 MB 整数，因为**模拟器自己也会读这一行**去生成
# hardware-qemu.ini，而那份里就是整数 MB（写成 6G 有被当成 6 MB 的风险）。
#
# ⚠️ 这两个值必须和 config.ini 一致 —— 以前 run-linux.sh 在命令行上写死了
#    `-memory 4096`，而**命令行优先于 config.ini**，所以这里写多少都没用
#    （hardware-qemu.ini 里永远是命令行那个值）。现在统一由 common.sh 读这里。
#
# ⚠️ 改这一行之后，**已存在的实例不会自动跟上**：hardware-qemu.ini 是首次启动
#    生成后就固定下来的（start 不会重建它，reset 会重建但连 /data 一起清）。
#    要让某个实例生效、又不丢数据，手工三步：
#        cp -f emulator/config.ini .run/sysdir-<port>/config.ini
#        rm -f .run/sysdir-<port>/hardware-qemu.ini
#        ./scripts/emulator.sh restart <实例>
hw.cpu.ncore=4
hw.ramSize=6144

# ── GPU：自适应 ─────────────────────────────────────────────────────────────
# auto = 宿主有可用的 DRM 渲染节点（/dev/dri/renderD*）就走真 GPU 加速，
#        没有就退回纯软件的 swiftshader_indirect。
# 判定与回退在 scripts/common.sh 的 resolve_gpu_mode()；启动时若 host 起不来
# 会自动退软件渲染（run-linux.sh 的候选循环）。
# 想钉死某一档：./scripts/emulator.sh start <实例> --gpu swiftshader_indirect
hw.gpu.enabled=yes
hw.gpu.mode=auto

# ── 屏幕：720p 横屏 / 320dpi ────────────────────────────────────────────────
# ROM 构建时 goldfish 的
#   device/generic/goldfish/64bitonly/product/x86_64-vendor.mk
# 会把 data/etc/config.ini.xl 装成产物里的 config.ini —— 那一份是
# **1440x2960 @560dpi**（Pixel 3 XL 尺寸）。1440x2960 要按 60fps 画 425 万像素，
# 是这套配置里最贵的一项；这里改成 1280x720 @320dpi：
#   · 像素量降到约 1/4.6
#   · 720p 是标准 16:9，逻辑尺寸 640 x 360 dp，density bucket = xhdpi
#   · **默认横屏**，且是把面板本身做成 1280x720（原生横屏），
#     不是"竖屏面板转到横屏" —— 好处是 /info 报的显示尺寸和触控范围
#     开机就一致，不用额外转一次。
#
# ⚠️ `hw.initialOrientation=landscape` **实测无效** —— 硬件 ini 里确实会写进去，
#    但开机仍是竖屏。真正决定面板尺寸的是 skin 和 hw.lcd.*，所以横屏得从这三行来。
hw.lcd.density=320
hw.lcd.width=1280
hw.lcd.height=720
skin.dynamic=no
skin.name=1280x720
skin.path=1280x720

# ── 其余硬件 ────────────────────────────────────────────────────────────────
hw.accelerometer=yes
hw.audioInput=yes
hw.battery=yes
hw.camera.back=emulated
hw.camera.front=emulated
hw.dPad=no
hw.gps=yes
hw.keyboard=yes
hw.mainKeys=no
hw.sensors.orientation=yes
hw.sensors.proximity=yes
image.sysdir.1=x86/
